[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyperliquid-asset-catalog"
version = "0.1.0"
description = "Read-only catalog of Hyperliquid native, HIP-3, XYZ and spot markets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5", "httpx>=0.27,<1", "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3", "pyyaml>=6,<7", "tenacity>=8.5,<10", "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["mypy>=1.11", "pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6", "types-PyYAML>=6"]

[project.scripts]
hl-catalog = "hl_asset_catalog.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hl_asset_catalog"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["hl_asset_catalog"]
