[build-system]
requires = ["hatchling>=1.27,<1.32"]
build-backend = "hatchling.build"

[project]
name = "hyperliquid-asset-catalog"
version = "0.1.0"
description = "Read-only catalog of Hyperliquid native, HIP-3, XYZ and spot markets"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Hugo Anthony Boutot" }]
keywords = ["hyperliquid", "hip-3", "market-data", "defi", "analytics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5", "httpx>=0.27,<1", "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3", "pyyaml>=6,<7", "tenacity>=8.5,<10", "typer>=0.12,<1",
]

[project.urls]
Repository = "https://github.com/Hug0x0/hyperliquid-asset-catalog"
Issues = "https://github.com/Hug0x0/hyperliquid-asset-catalog/issues"

[project.optional-dependencies]
parquet = ["pyarrow>=17,<24"]
docs = ["mkdocs-material>=9.6,<10"]
dev = ["build>=1.3,<2", "hypothesis>=6.138,<7", "jsonschema>=4.25,<5", "mypy>=1.11", "mutmut>=3.3,<4", "pip-audit>=2.9,<3", "pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=6,<8", "respx>=0.21", "ruff>=0.6", "twine>=6.2,<7", "types-PyYAML>=6"]

[project.scripts]
hl-catalog = "hl_asset_catalog.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hl_asset_catalog"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["hl_asset_catalog"]
omit = ["src/hl_asset_catalog/__init__.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.mutmut]
paths_to_mutate = [
  "src/hl_asset_catalog/events.py",
  "src/hl_asset_catalog/classification.py",
  "src/hl_asset_catalog/statistics.py",
]
tests_dir = ["tests/"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["hl_asset_catalog"]
