name: Documentation
on:
  push:
    branches: [main]
    paths: ["docs/**", "site-docs/**", "mkdocs.yml", "README.md", "CONTRIBUTING.md", "SECURITY.md"]
  pull_request:
    paths: ["docs/**", "site-docs/**", "mkdocs.yml", "README.md", "CONTRIBUTING.md", "SECURITY.md"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e '.[docs]'
      - run: python scripts/build_site_docs.py
      - run: hl-catalog --help && hl-catalog calibrate-scores
      - run: mkdocs build --strict
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --root-dir site './site/**/*.html'
      - run: npm install -g @lhci/cli@0.15.x
      - run: lhci autorun
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
