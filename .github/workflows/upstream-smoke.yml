name: Upstream API smoke test

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Discover DEXes
        id: dexes
        continue-on-error: true
        run: hl-catalog list-dexes --timeout 30
      - name: Fetch and validate catalog
        id: catalog
        continue-on-error: true
        run: |
          hl-catalog fetch --active-only --output-dir smoke-output --cache-dir smoke-cache
          hl-catalog validate --output-dir smoke-output --json
      - name: Upload failure report
        if: always() && (steps.dexes.outcome == 'failure' || steps.catalog.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-smoke-report
          path: smoke-output/run_report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Enforce smoke-test result
        if: always()
        env:
          DEX_OUTCOME: ${{ steps.dexes.outcome }}
          CATALOG_OUTCOME: ${{ steps.catalog.outcome }}
        run: test "$DEX_OUTCOME" = success -a "$CATALOG_OUTCOME" = success
