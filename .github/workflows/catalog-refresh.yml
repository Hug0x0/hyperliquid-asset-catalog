name: Catalog refresh

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[parquet]'
      - name: Refresh catalog
        id: refresh
        run: |
          hl-catalog fetch --active-only --json-logs
          hl-catalog validate --json
          hl-catalog export --format parquet
      - name: Build refresh manifest
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          REVISION: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          Path("refresh-manifest.json").write_text(json.dumps({
              "schema_version": "1.0",
              "run_id": os.environ["RUN_ID"],
              "revision": os.environ["REVISION"],
              "completed_at": datetime.now(timezone.utc).isoformat(),
          }, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: catalog-snapshot-${{ github.run_id }}
          path: |
            output/all_assets.json
            output/catalog_diff.json
            output/run_report.json
            output/parquet/
            refresh-manifest.json
          if-no-files-found: warn
          retention-days: 30
      - name: Alert on refresh failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = `ops: catalog refresh failed (${context.runId})`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 100
            });
            const activeAlert = existing.data.some(issue => issue.title.startsWith('ops: catalog refresh failed'));
            if (!activeAlert) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title,
                body: `Scheduled refresh failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              });
            }
