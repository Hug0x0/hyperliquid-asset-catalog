name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, wallet material, or private account data.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
      placeholder: Git commit SHA or package version
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Reproduction command
      render: shell
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized output and evidence
      description: Include relevant errors, manifest metadata, and source URLs without credentials.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and installation method.
    validations:
      required: true
